<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172033"><text x="40" y="45" font-size="26" font-weight="bold">Four keys · independent signals, shared ground</text><text x="40" y="78" font-size="17">Normally open switches shown released. No power-pin jumper required.</text><rect x="40" y="110" width="310" height="410" rx="15" fill="#e2e8f0" stroke="#94a3b8"/><text x="65" y="145" font-size="22" font-weight="bold">Raspberry Pi Zero W</text><text x='65' y='192' font-size='18'>GPIO17 · physical pin 11</text><path d='M350 185 H570' stroke='#2563eb' stroke-width='4' fill='none'/><path d='M570 185 L621 162 M630 185 H830' stroke='#475569' stroke-width='4' fill='none'/><circle cx='570' cy='185' r='5'/><circle cx='630' cy='185' r='5'/><circle cx='830' cy='185' r='5'/><text x='560' y='145' font-size='18'>Key 1</text><text x='65' y='272' font-size='18'>GPIO27 · physical pin 13</text><path d='M350 265 H570' stroke='#059669' stroke-width='4' fill='none'/><path d='M570 265 L621 242 M630 265 H830' stroke='#475569' stroke-width='4' fill='none'/><circle cx='570' cy='265' r='5'/><circle cx='630' cy='265' r='5'/><circle cx='830' cy='265' r='5'/><text x='560' y='225' font-size='18'>Key 2</text><text x='65' y='352' font-size='18'>GPIO22 · physical pin 15</text><path d='M350 345 H570' stroke='#7c3aed' stroke-width='4' fill='none'/><path d='M570 345 L621 322 M630 345 H830' stroke='#475569' stroke-width='4' fill='none'/><circle cx='570' cy='345' r='5'/><circle cx='630' cy='345' r='5'/><circle cx='830' cy='345' r='5'/><text x='560' y='305' font-size='18'>Key 3</text><text x='65' y='432' font-size='18'>GPIO23 · physical pin 16</text><path d='M350 425 H570' stroke='#d97706' stroke-width='4' fill='none'/><path d='M570 425 L621 402 M630 425 H830' stroke='#475569' stroke-width='4' fill='none'/><circle cx='570' cy='425' r='5'/><circle cx='630' cy='425' r='5'/><circle cx='830' cy='425' r='5'/><text x='560' y='385' font-size='18'>Key 4</text><path d="M830 185 V485 H350" stroke="#475569" stroke-width="4" fill="none"/><text x="65" y="492" font-size="18">GND · physical pin 14</text><text x="850" y="285" font-size="17">Shared</text><text x="850" y="309" font-size="17">ground</text><text x="40" y="557" font-size="18">Software: input + internal pull-up. Released = HIGH; pressed = LOW.</text><text x="40" y="587" font-size="16">Physical pin 14 is GND. GPIO14 (physical pin 8) is not ground.</text></g></svg>
